name = "ent-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# No account_id on purpose: `wrangler login` asks which account to deploy to.

[vars]
# How often the relay reads the scouting API. Scouts upload every 3s, so faster buys little, and
# each read is one storage write against the free plan's daily allowance.
POLL_INTERVAL_MS = "1500"

[[durable_objects.bindings]]
name = "CALL_RELAY"
class_name = "CallRelay"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRelay"]
